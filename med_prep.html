<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИКП — Подготовка к экзамену</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f1a;--surface:#111827;--surface2:#1a2235;--border:#1e2d45;--accent:#3b82f6;--accent2:#06b6d4;--accent3:#10b981;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--muted:#64748b;--light:#94a3b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;line-height:1.6;min-height:100vh}
  header{background:linear-gradient(135deg,#0b0f1a 0%,#111827 50%,#0f1e38 100%);border-bottom:1px solid var(--border);padding:1.5rem 2rem;text-align:center;position:sticky;top:0;z-index:100}
  header h1{font-family:'Playfair Display',serif;font-size:1.6rem;background:linear-gradient(135deg,#60a5fa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.2rem}
  header p{color:var(--muted);font-size:0.8rem}
  #timer{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:0.3rem 0.9rem;font-family:'IBM Plex Mono',monospace;font-size:0.95rem;color:var(--accent2);margin-top:0.4rem;letter-spacing:2px}
  .controls{max-width:1100px;margin:1.2rem auto;padding:0 1.2rem;display:flex;gap:0.8rem;flex-wrap:wrap;align-items:center}
  .search-box{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0.6rem 0.9rem;color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:0.88rem;outline:none;transition:border-color .2s}
  .search-box:focus{border-color:var(--accent)}
  .search-box::placeholder{color:var(--muted)}
  .filter-btns{display:flex;gap:0.4rem;flex-wrap:wrap}
  .filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--light);padding:0.4rem 0.8rem;border-radius:20px;cursor:pointer;font-size:0.78rem;font-family:'IBM Plex Sans',sans-serif;transition:all .2s}
  .filter-btn:hover,.filter-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .progress-bar-wrap{max-width:1100px;margin:0 auto 0.8rem;padding:0 1.2rem}
  .progress-info{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--muted);margin-bottom:4px}
  .progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease}
  .grid{max-width:1100px;margin:0 auto;padding:0 1.2rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:0.9rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .15s,border-color .2s}
  .card:hover{transform:translateY(-2px);border-color:#2a3f5f}
  .card.learned{border-color:var(--accent3)}
  .card-header{padding:0.9rem 1.1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:0.8rem;border-left:3px solid transparent;user-select:none}
  .card.learned .card-header{border-left-color:var(--accent3)}
  .card-header:hover{background:var(--surface2)}
  .card-meta{flex:1}
  .card-num{font-family:'IBM Plex Mono',monospace;font-size:0.7rem;color:var(--accent);font-weight:500;margin-bottom:0.25rem}
  .card-title{font-size:0.9rem;font-weight:500;color:var(--text);line-height:1.4}
  .card-tags{margin-top:0.4rem;display:flex;gap:0.35rem;flex-wrap:wrap}
  .tag{font-size:0.67rem;padding:0.12rem 0.45rem;border-radius:10px;font-weight:500}
  .tag-resp{background:#1e3a5f;color:#60a5fa}
  .tag-cv{background:#3b1f1f;color:#f87171}
  .tag-gen{background:#1f3030;color:#6ee7b7}
  .card-actions{display:flex;align-items:center;gap:0.4rem}
  .btn-learn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:0.28rem 0.55rem;font-size:0.72rem;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'IBM Plex Sans',sans-serif}
  .btn-learn:hover{border-color:var(--accent3);color:var(--accent3)}
  .card.learned .btn-learn{background:var(--accent3);border-color:var(--accent3);color:#fff}
  .chevron{color:var(--muted);font-size:0.75rem;transition:transform .25s;flex-shrink:0;margin-top:3px}
  .card.open .chevron{transform:rotate(180deg)}
  .card-body{display:none;padding:0 1.1rem 1.1rem;border-top:1px solid var(--border)}
  .card.open .card-body{display:block}
  .sections{margin-top:0.7rem}
  .section{margin-bottom:0.75rem}
  .section-title{font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.35rem;display:flex;align-items:center;gap:0.35rem}
  .s-causes{color:#f59e0b}.s-symptoms{color:#60a5fa}.s-inspect{color:#06b6d4}.s-palp{color:#a78bfa}.s-perc{color:#34d399}.s-ausc{color:#fb923c}.s-lab{color:#f472b6}.s-other{color:var(--light)}
  .section ul{padding-left:1rem}
  .section li{font-size:0.83rem;color:var(--light);line-height:1.5;margin-bottom:0.12rem}
  .no-results{grid-column:1/-1;text-align:center;padding:3rem;color:var(--muted);font-size:1rem}
  @media(max-width:600px){.grid{grid-template-columns:1fr;padding:0 0.8rem 3rem}header h1{font-size:1.3rem}.controls{padding:0 0.8rem}}
</style>
</head>
<body>
<header>
  <h1>📋 ИКП — Подготовка к экзамену</h1>
  <p>Вопросы 1–88 · Общий осмотр · Дыхательная система · ССС</p>
  <div id="timer">4:00:00</div>
</header>

<div class="controls">
  <input class="search-box" type="text" id="search" placeholder="🔍 Поиск по теме...">
  <div class="filter-btns">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="general">Общий осмотр</button>
    <button class="filter-btn" data-filter="resp">Дыхание</button>
    <button class="filter-btn" data-filter="cv">ССС</button>
    <button class="filter-btn" data-filter="learned">✅ Изучено</button>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-info"><span id="prog-text">Изучено: 0 / 0</span><span id="prog-pct">0%</span></div>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
</div>

<div class="grid" id="cardGrid"></div>

<script>
const DATA=[
{id:0,num:"Вопрос 1",cat:"general",title:"Анамнез жизни: разделы, диагностическое значение",sections:[
{type:"other",label:"Разделы анамнеза жизни",icon:"📋",items:["Перенесённые болезни (детство, юность, зрелость)","Профессия и профессиональные вредности","Бытовые условия, питание","Вредные привычки (курение, алкоголь)","Семейный анамнез (наследственность)","Эпидемиологический анамнез","Аллергологический анамнез","Гинекологический анамнез (у женщин)"]},
{type:"other",label:"Диагностическое значение",icon:"💡",items:["Выявление предрасполагающих факторов","Оценка наследственной отягощённости","Выявление причин болезни и рисков"]}
]},
{id:1,num:"Вопрос 2",cat:"general",title:"Общий осмотр: тяжесть состояния, конституция, кожа",sections:[
{type:"inspect",label:"Степени тяжести / сознание",icon:"🔴",items:["Ступор — оглушение; ответы с запозданием (контузии, отравления)","Сопор — 'спячка'; выходит при оклике; рефлексы сохранены (уремия, инфекции)","Кома — полное отсутствие реакций, нарушение витальных функций"]},

{type:"inspect",label:"Конституциональные типы",icon:"🧬",items:["Астенический: продольные > поперечные, низкое АД, гипофункция надпочечников, гиперфункция щитовидной","Гиперстенический: поперечные > продольные, высокое АД, гипофункция щитовидной","Нормостенический: пропорциональный"]},

]},

]},

{type:"other",label:"Степени повышения t°",icon:"🌡️",items:["Субфебрильная: 37–38°С","Умеренная: 38–39°С","Высокая: 39–40°С","Чрезмерно высокая: >40°С","Гиперпиретическая: >41–42°С — опасна!"]},
{type:"other",label:"6 основных типов лихорадки",icon:"📊",items:["1. Постоянная (continua): колебания <1°С → крупозная пневмония, брюшной тиф II ст.","2. Послабляющая (remittens): >1°С, min выше 37°С → туберкулёз, гнойные болезни","3. Перемежающаяся (intermittens): min в норме → малярия","4. Гектическая (hectica): скачки 2–4°С, изнуряющие поты → тяжёлый туберкулёз, сепсис","5. Обратная (inversus): утренняя > вечерней → сепсис, бруцеллёз","6. Неправильная (irregularis) → ревматизм, эндокардит"]},
{type:"other",label:"Дополнительные формы",icon:"〰️",items:["Возвратная: чередование лихорадки и нормы","Волнообразная (undulans): нарастание и спад → бруцеллёз, лимфогранулематоз"]}
]},

{type:"lab",label:"Лабораторные методы",icon:"🔬",items:["ОАК: эозинофилия + лимфоцитоз","Мокрота: эозинофилы + спирали Куршмана + кристаллы Шарко–Лейдена","Кожные пробы на аллергены"]},

{id:5,num:"Вопрос 6",cat:"resp",title:"Жалобы и патогенез при заболеваниях дыхания",sections:[

{type:"symptoms",label:"Одышка",icon:"😮‍💨",items:["Экспираторная (затруднён выдох) — ХОБЛ, БА, эмфизема","Инспираторная (затруднён вдох) — препятствие в верхних ДП","Смешанная — пневмония, плеврит, пневмоторакс, отёк лёгких"]},
{type:"symptoms",label:"Боль в грудной клетке",icon:"🔴",items:["Плевральная: односторонняя, усиливается на вдохе, при кашле","Паренхима лёгких болевых рецепторов НЕ имеет"]}
]},
{id:6,num:"Вопрос 7",cat:"resp",title:"Синдром очагового уплотнения лёгочной ткани",sections:[

{type:"inspect",label:"Общий осмотр",icon:"👁️",items:["Отставание поражённой стороны при дыхании","Цианоз при распространённом поражении"]},
{type:"palp",label:"Пальпация",icon:"✋",items:["Голосовое дрожание УСИЛЕНО"]},
{type:"perc",label:"Перкуссия",icon:"🥁",items:["УКОРОЧЕНИЕ (притупление) перкуторного звука"]},

]},

{type:"causes",label:"Обтурационный",icon:"⚠️",items:["Закрытие бронха изнутри: опухоль, мокрота, инородное тело"]},

let learnedSet=new Set(JSON.parse(localStorage.getItem('ikp_learned')||'[]'));
let currentFilter='all';

function saveProgress(){localStorage.setItem('ikp_learned',JSON.stringify([...learnedSet]))}

function updateProgress(){
  const all=[...document.querySelectorAll('.card')];
  const visible=all.filter(c=>c.style.display!=='none');
  const done=visible.filter(c=>c.classList.contains('learned')).length;
  document.getElementById('prog-text').textContent=`Изучено: ${done} / ${visible.length}`;
  const pct=visible.length?Math.round(done/visible.length*100):0;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
}

function sectionHTML(s){
  const m={causes:'s-causes',symptoms:'s-symptoms',inspect:'s-inspect',palp:'s-palp',perc:'s-perc',ausc:'s-ausc',lab:'s-lab',other:'s-other'};
  return`<div class="section"><div class="section-title ${m[s.type]||'s-other'}">${s.icon} ${s.label}</div><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
}

function buildCards(){
  const grid=document.getElementById('cardGrid');
  grid.innerHTML='';
  const tagMap={general:{l:'Общий осмотр',c:'tag-gen'},resp:{l:'Дыхание',c:'tag-resp'},cv:{l:'ССС',c:'tag-cv'}};
  DATA.forEach(d=>{
    const isL=learnedSet.has(d.id);
    const t=tagMap[d.cat]||tagMap.general;
    const card=document.createElement('div');
    card.className='card'+(isL?' learned':'');
    card.dataset.id=d.id;card.dataset.cat=d.cat;
    card.dataset.search=(d.title+' '+d.num).toLowerCase();
    card.innerHTML=`<div class="card-header"><div class="card-meta"><div class="card-num">${d.num}</div><div class="card-title">${d.title}</div><div class="card-tags"><span class="tag ${t.c}">${t.l}</span></div></div><div class="card-actions"><button class="btn-learn">${isL?'✅ Изучено':'○ Отметить'}</button><span class="chevron">▼</span></div></div><div class="card-body"><div class="sections">${d.sections.map(sectionHTML).join('')}</div></div>`;
    card.querySelector('.card-header').addEventListener('click',e=>{if(e.target.classList.contains('btn-learn'))return;card.classList.toggle('open')});
    card.querySelector('.btn-learn').addEventListener('click',e=>{
      e.stopPropagation();
      const id=+card.dataset.id;
      if(learnedSet.has(id)){learnedSet.delete(id);card.classList.remove('learned');e.target.textContent='○ Отметить'}
      else{learnedSet.add(id);card.classList.add('learned');e.target.textContent='✅ Изучено'}
      saveProgress();updateProgress();
    });
    grid.appendChild(card);
  });
  applyFilters();
}

function applyFilters(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(c=>{
    const catOk=currentFilter==='all'||(currentFilter==='learned'?c.classList.contains('learned'):c.dataset.cat===currentFilter);
    const txtOk=!q||c.dataset.search.includes(q);
    c.style.display=(catOk&&txtOk)?'':'none';
  });
  const nr=document.querySelector('.no-results');
  const vis=[...document.querySelectorAll('.card')].filter(c=>c.style.display!=='none');
  if(!vis.length){if(!nr){const d=document.createElement('div');d.className='no-results';d.textContent='Ничего не найдено.';document.getElementById('cardGrid').appendChild(d)}}
  else if(nr)nr.remove();
  updateProgress();
}

document.getElementById('search').addEventListener('input',applyFilters);
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentFilter=btn.dataset.filter;applyFilters();
  });
});

let totalSecs=4*3600;
function tick(){const h=Math.floor(totalSecs/3600),m=Math.floor(totalSecs%3600/60),s=totalSecs%60;document.getElementById('timer').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(totalSecs>0)totalSecs--}
tick();setInterval(tick,1000);
buildCards();
</script>
</body>
</html>
